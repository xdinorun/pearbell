<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PearBell — a simple, fast school bell schedule countdown."
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>PearBell</title>

    <link
        rel="stylesheet"
        href="style.css?v=3"
    >
</head>

<body>

    <!-- =====================================
         SCHOOL PICKER
    ====================================== -->

    <main
        id="school-screen"
        class="screen"
    >

        <section class="school-picker">

            <div class="intro-logo">

                <div
                    id="rolling-pear"
                    class="rolling-pear"
                    aria-hidden="true"
                >
                    🍐
                </div>

                <h1
                    id="intro-title"
                    class="intro-title"
                >
                    PearBell
                </h1>

            </div>


            <div
                id="school-select-area"
                class="school-select-area"
            >

                <label
                    for="school-select"
                    class="school-label"
                >
                    Choose your school
                </label>


                <div class="select-wrapper">

                    <select
                        id="school-select"
                        aria-label="Choose your school"
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Select your school
                        </option>

                        <option value="wilcox">
                            Adrian Wilcox High School
                        </option>

                        <option value="santa-clara">
                            Santa Clara High School
                        </option>

                        <option value="cupertino">
                            Cupertino High School
                        </option>

                    </select>

                </div>


                <button
                    id="school-confirm"
                    type="button"
                    disabled
                >
                    Continue
                </button>


                <p class="help">
                    Don't see your school?
                    Email us at
                    <a href="mailto:help@pearbell.org">
                        help@pearbell.org
                    </a>
                </p>

            </div>

        </section>

    </main>



    <!-- =====================================
         COUNTDOWN
    ====================================== -->

    <main
        id="countdown-screen"
        class="screen hidden"
    >

        <header class="countdown-header">

            <div class="mini-brand">

                <span aria-hidden="true">
                    🍐
                </span>

                <span>
                    PearBell
                </span>

            </div>

        </header>


        <section class="countdown-container">

            <div
                id="countdown"
                aria-live="polite"
            >
                --:--
            </div>


            <div id="countdown-label">
                Loading schedule...
            </div>


            <div class="current-block">

                <div id="current-period">
                    Current Period
                </div>

                <div id="period-times">
                    --:-- → --:--
                </div>

            </div>


            <div
                id="next-block-container"
                class="next-block"
            >

                <div class="next-divider"></div>

                <div>

                    <span class="next-prefix">
                        Next:
                    </span>

                    <span id="next-period">
                        —
                    </span>

                </div>

                <div id="next-period-times">
                    —
                </div>

            </div>


            <button
                id="change-school"
                type="button"
            >
                <span aria-hidden="true">
                    ⇄
                </span>

                Change School
            </button>


            <div id="school-name">
                PearBell
            </div>

        </section>

    </main>



    <!-- =====================================
         THEME BUTTON
    ====================================== -->

    <button
        id="theme-toggle"
        type="button"
        aria-label="Change theme"
        aria-expanded="false"
    >
        <span class="theme-wheel"></span>
    </button>



    <!-- =====================================
         THEME PANEL
    ====================================== -->

    <aside
        id="theme-panel"
        class="theme-panel hidden"
        aria-label="Theme settings"
    >

        <div class="theme-panel-header">

            <strong>
                Theme
            </strong>

            <button
                id="theme-close"
                type="button"
                aria-label="Close theme settings"
            >
                ×
            </button>

        </div>


        <div class="color-setting">

            <label for="background-color">
                Background
            </label>

            <input
                id="background-color"
                type="color"
                value="#ffffff"
                aria-label="Background color"
            >

        </div>


        <div class="color-setting">

            <label for="text-color">
                Text
            </label>

            <input
                id="text-color"
                type="color"
                value="#111111"
                aria-label="Text color"
            >

        </div>


        <div class="preset-label">
            Presets
        </div>


        <div class="theme-presets">

            <button
                class="theme-preset preset-default"
                type="button"
                data-background="#ffffff"
                data-text="#111111"
                aria-label="White theme"
                title="White"
            ></button>

            <button
                class="theme-preset preset-dark"
                type="button"
                data-background="#111111"
                data-text="#ffffff"
                aria-label="Dark theme"
                title="Dark"
            ></button>

            <button
                class="theme-preset preset-blue"
                type="button"
                data-background="#edf4ff"
                data-text="#14213d"
                aria-label="Blue theme"
                title="Blue"
            ></button>

            <button
                class="theme-preset preset-purple"
                type="button"
                data-background="#f5efff"
                data-text="#38205f"
                aria-label="Purple theme"
                title="Purple"
            ></button>

            <button
                class="theme-preset preset-green"
                type="button"
                data-background="#f1f8ed"
                data-text="#23351e"
                aria-label="Green theme"
                title="Green"
            ></button>

            <button
                class="theme-preset preset-pink"
                type="button"
                data-background="#fff1f5"
                data-text="#4a1f2b"
                aria-label="Pink theme"
                title="Pink"
            ></button>

        </div>


        <button
            id="reset-theme"
            type="button"
        >
            Reset to default
        </button>

    </aside>



    <!-- =====================================
         SCHOOL DATA
    ====================================== -->

    <script src="schedules/wilcox.js"></script>
    <script src="schedules/santa-clara.js"></script>
    <script src="schedules/cupertino.js"></script>


    <!-- =====================================
         PEARBELL
    ====================================== -->

    <script src="script.js?v=3"></script>

</body>

</html>
